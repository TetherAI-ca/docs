      type: "http"
      scheme: "bearer"
      description: "API Integration Key from Settings > General Settings. Pass as: Authorization: Bearer <your-api-key>"
  schemas:
    ApiResponse:
      type: "object"
      additionalProperties: true
      description: "Generic response envelope. Endpoint-specific fields are intentionally open."
    ApiError:
      type: "object"
      additionalProperties: true
      properties:
        message:
          type: "string"
