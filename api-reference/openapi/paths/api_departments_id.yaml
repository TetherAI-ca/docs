get:
  operationId: "get_api_departments_id"
  summary: "GET /api/departments/{id}"
  tags:
    - "Departments"
  responses:
    "200":
      description: "Successful response"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiResponse"
    "400":
      description: "Bad request"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    "401":
      description: "Unauthorized"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
    "500":
      description: "Internal server error"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/ApiError"
  parameters:
    -
      in: "path"
      name: "id"
      required: true
      schema:
        type: "string"
  security:
    -
      bearerAuth:
        []
